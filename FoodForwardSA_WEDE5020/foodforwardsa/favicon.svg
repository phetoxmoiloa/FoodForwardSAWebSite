<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Original mark: a leaf/route hybrid — a folded path (the route) that
       resolves into a leaf shape (the food). Created for this project,
       no external asset used, so no licensing concerns. -->
  <rect width="64" height="64" rx="12" fill="#1F4D3A"/>
  <path d="M14 40 C 22 40, 22 24, 32 24 C 42 24, 42 40, 50 40"
        fill="none" stroke="#E3A23D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  <circle cx="14" cy="40" r="4" fill="#E3A23D"/>
  <circle cx="50" cy="40" r="4" fill="#FFFFFF"/>
</svg>
